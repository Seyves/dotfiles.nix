# ============================================= #
# Start with defaults from the Sensible plugin  #
# --------------------------------------------- #
run-shell /nix/store/f2h85j27phf2d012xilmimmbc16kc90x-tmuxplugin-sensible-3.0.0-unstable-2022-08-14/share/tmux-plugins/sensible/sensible.tmux
# ============================================= #

set  -g default-terminal "screen-256color"
set  -g base-index      1
setw -g pane-base-index 1
# We need to set default-shell before calling new-session
set  -g default-shell "/nix/store/rdxc7wg0r196bf6cicanfgcdkqhq9m9l-fish-4.9.3/bin/fish"

set -g status-keys vi
set -g mode-keys   vi

bind -N "Select pane to the left of the active pane" h select-pane -L
bind -N "Select pane below the active pane" j select-pane -D
bind -N "Select pane above the active pane" k select-pane -U
bind -N "Select pane to the right of the active pane" l select-pane -R

bind -r -N "Resize the pane left by 5" \
  H resize-pane -L 5
bind -r -N "Resize the pane down by 5" \
  J resize-pane -D 5
bind -r -N "Resize the pane up by 5" \
  K resize-pane -U 5
bind -r -N "Resize the pane right by 5" \
  L resize-pane -R 5

# rebind main key: C-s
unbind C-b
set -g prefix C-s
bind -N "Send the prefix key through to the application" \
  C-s send-prefix

set  -g mouse             off
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       10
set  -g history-limit     100000

bind-key x kill-pane
bind-key g choose-session
bind-key v split-window -h 
bind-key s split-window -v 
set -a terminal-features "screen-256color:RGB"
set -g status-bg default
set -g renumber-windows on
set -g status-style bg=default
set -g status-fg color15
set-option -g window-status-current-format "#[fg=color9] #I:#W#{?window_zoomed_flag, 󰊓 , }"
set-option -g status-right ""   
setw -g mode-keys vi
set -sg escape-time 10
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind S run-shell "tmux neww ~/.config/tmux/tmux-session-dispensary.sh"
